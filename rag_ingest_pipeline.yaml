# PIPELINE DEFINITION
# Name: rag-ingest-pipeline
# Description: Data-chain-only RAG pipeline: parse & chunk PDFs with Docling (output to S3), then ingest into Milvus with local or remote embeddings. No model deployment steps.
# Inputs:
#    batch_size: int [Default: 4.0]
#    bypass_kueue: bool [Default: False]
#    chunk_max_tokens: int [Default: 256.0]
#    collection_name: str [Default: 'rag_documents']
#    cpus_per_actor: int [Default: 4.0]
#    doc_category: str [Default: '']
#    doc_date: str [Default: '']
#    doc_subcategory: str [Default: '']
#    drop_existing: bool [Default: True]
#    embed_batch_size: int [Default: 64.0]
#    embedding_dim: int [Default: 768.0]
#    embedding_endpoint: str [Default: '']
#    embedding_model: str [Default: 'ibm-granite/granite-embedding-125m-english']
#    enable_profiling: bool [Default: False]
#    head_cpus: int [Default: 2.0]
#    head_memory_gb: int [Default: 8.0]
#    index_type: str [Default: 'HNSW']
#    input_path: str [Default: 'input/pdfs']
#    max_actors: int [Default: 4.0]
#    milvus_batch_size: int [Default: 256.0]
#    milvus_db: str [Default: 'default']
#    milvus_host: str [Default: 'milvus-milvus.milvus.svc.cluster.local']
#    milvus_port: int [Default: 19530.0]
#    milvus_token: str [Default: '']
#    min_actors: int [Default: 2.0]
#    namespace: str [Default: 'ray-docling']
#    num_files: int [Default: 1000.0]
#    num_workers: int [Default: 2.0]
#    pipeline_run_id: str [Default: '']
#    pvc_mount_path: str [Default: '/mnt/data']
#    pvc_name: str [Default: 'data-pvc']
#    ray_image: str [Default: 'quay.io/rhoai-szaher/docling-ray:latest']
#    s3_bucket: str [Default: 'rag-chunks']
#    s3_endpoint: str [Default: 'http://minio-service.default.svc.cluster.local:9000']
#    s3_prefix: str [Default: 'chunks']
#    s3_secret_name: str [Default: 'minio-secret']
#    timeout_seconds: int [Default: 600.0]
#    verbose: bool [Default: True]
#    worker_cpus: int [Default: 8.0]
#    worker_memory_gb: int [Default: 16.0]
components:
  comp-ingest-to-milvus:
    executorLabel: exec-ingest-to-milvus
    inputDefinitions:
      parameters:
        collection_name:
          defaultValue: rag_documents
          description: Milvus collection name.
          isOptional: true
          parameterType: STRING
        drop_existing:
          defaultValue: true
          description: If True, drop and recreate the collection. If False, append
            to it.
          isOptional: true
          parameterType: BOOLEAN
        embed_batch_size:
          defaultValue: 64.0
          description: Batch size for embedding requests.
          isOptional: true
          parameterType: NUMBER_INTEGER
        embedding_dim:
          defaultValue: 768.0
          description: Dimension of the embedding vectors.
          isOptional: true
          parameterType: NUMBER_INTEGER
        embedding_endpoint:
          defaultValue: ''
          description: 'Optional embedding service URL. If empty,

            uses a local sentence-transformers model.'
          isOptional: true
          parameterType: STRING
        embedding_model:
          defaultValue: ibm-granite/granite-embedding-125m-english
          description: Embedding model name (for API or local).
          isOptional: true
          parameterType: STRING
        index_type:
          defaultValue: HNSW
          isOptional: true
          parameterType: STRING
        milvus_batch_size:
          defaultValue: 256.0
          description: Batch size for Milvus inserts.
          isOptional: true
          parameterType: NUMBER_INTEGER
        milvus_db:
          defaultValue: default
          description: Milvus database name.
          isOptional: true
          parameterType: STRING
        milvus_host:
          description: Milvus service hostname.
          parameterType: STRING
        milvus_port:
          defaultValue: 19530.0
          description: Milvus gRPC port.
          isOptional: true
          parameterType: NUMBER_INTEGER
        milvus_token:
          defaultValue: ''
          description: Milvus authentication token. Empty string for unauthenticated
            connections.
          isOptional: true
          parameterType: STRING
        pipeline_run_id:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        s3_bucket:
          description: S3 bucket containing chunk files.
          parameterType: STRING
        s3_endpoint:
          description: S3-compatible endpoint URL (e.g. MinIO).
          parameterType: STRING
        s3_prefix:
          defaultValue: chunks
          description: Key prefix for chunk files in S3.
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-parse-and-chunk:
    executorLabel: exec-parse-and-chunk
    inputDefinitions:
      parameters:
        batch_size:
          defaultValue: 4.0
          description: Files per batch sent to each actor.
          isOptional: true
          parameterType: NUMBER_INTEGER
        bypass_kueue:
          defaultValue: false
          description: 'If True, remove the Kueue queue-name label and manually

            unsuspend the RayJob, bypassing cluster quota management. Only use

            on clusters without Kueue or with sufficient free resources.'
          isOptional: true
          parameterType: BOOLEAN
        chunk_max_tokens:
          defaultValue: 256.0
          description: Max tokens per chunk (HybridChunker).
          isOptional: true
          parameterType: NUMBER_INTEGER
        cpus_per_actor:
          defaultValue: 4.0
          description: CPUs per Docling processing actor.
          isOptional: true
          parameterType: NUMBER_INTEGER
        doc_category:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        doc_date:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        doc_subcategory:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        enable_profiling:
          defaultValue: false
          description: Enable cProfile profiling (outputs profile stats).
          isOptional: true
          parameterType: BOOLEAN
        head_cpus:
          defaultValue: 2.0
          description: CPUs for the Ray head pod.
          isOptional: true
          parameterType: NUMBER_INTEGER
        head_memory_gb:
          defaultValue: 8.0
          description: Memory (GB) for the Ray head pod.
          isOptional: true
          parameterType: NUMBER_INTEGER
        input_path:
          description: Relative path to input PDFs under the PVC.
          parameterType: STRING
        max_actors:
          defaultValue: 4.0
          description: Maximum actor pool size.
          isOptional: true
          parameterType: NUMBER_INTEGER
        min_actors:
          defaultValue: 2.0
          description: Minimum actor pool size.
          isOptional: true
          parameterType: NUMBER_INTEGER
        namespace:
          description: OpenShift namespace for the RayJob.
          parameterType: STRING
        num_files:
          defaultValue: 0.0
          description: Number of PDFs to process (0 = all).
          isOptional: true
          parameterType: NUMBER_INTEGER
        num_workers:
          defaultValue: 2.0
          description: Number of Ray worker pods.
          isOptional: true
          parameterType: NUMBER_INTEGER
        pvc_mount_path:
          description: Mount path for the PVC inside pods.
          parameterType: STRING
        pvc_name:
          description: Name of the PVC with input PDFs.
          parameterType: STRING
        ray_image:
          description: Container image with Ray + Docling pre-installed.
          parameterType: STRING
        s3_bucket:
          description: S3 bucket for output chunks.
          parameterType: STRING
        s3_endpoint:
          description: S3-compatible endpoint URL (e.g. MinIO).
          parameterType: STRING
        s3_prefix:
          defaultValue: chunks
          description: Key prefix for chunk files in S3.
          isOptional: true
          parameterType: STRING
        s3_secret_name:
          defaultValue: minio-secret
          description: 'Kubernetes Secret with S3 credentials (keys: access_key, secret_key).'
          isOptional: true
          parameterType: STRING
        timeout_seconds:
          defaultValue: 600.0
          description: Per-file processing timeout.
          isOptional: true
          parameterType: NUMBER_INTEGER
        tokenizer:
          defaultValue: sentence-transformers/all-MiniLM-L6-v2
          description: Tokenizer for HybridChunker (usually the embedding model name).
          isOptional: true
          parameterType: STRING
        verbose:
          defaultValue: true
          description: Enable verbose logging for debugging.
          isOptional: true
          parameterType: BOOLEAN
        worker_cpus:
          defaultValue: 8.0
          description: CPUs per worker pod.
          isOptional: true
          parameterType: NUMBER_INTEGER
        worker_memory_gb:
          defaultValue: 16.0
          description: Memory (GB) per worker pod.
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-ingest-to-milvus:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - ingest_to_milvus
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pymilvus>=2.4.0'\
          \ 'sentence-transformers>=2.2.0' 'requests>=2.28.0' 'boto3>=1.28.0' 'rhoai-lineage\
          \ @ git+https://github.com/briangallagher/rhoai-lineage.git'  &&  python3\
          \ -m pip install --quiet --no-warn-script-location 'kfp==2.16.1' '--no-deps'\
          \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\
          \n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef ingest_to_milvus(\n    s3_endpoint: str,\n    s3_bucket: str,\n\
          \    milvus_host: str,\n    s3_prefix: str = \"chunks\",\n    embedding_endpoint:\
          \ str = \"\",\n    embedding_model: str = \"ibm-granite/granite-embedding-125m-english\"\
          ,\n    embedding_dim: int = 768,\n    milvus_port: int = 19530,\n    milvus_db:\
          \ str = \"default\",\n    milvus_token: str = \"\",\n    collection_name:\
          \ str = \"rag_documents\",\n    drop_existing: bool = True,\n    embed_batch_size:\
          \ int = 64,\n    milvus_batch_size: int = 256,\n    pipeline_run_id: str\
          \ = \"\",\n    index_type: str = \"HNSW\",\n) -> str:\n    \"\"\"Read chunks\
          \ from S3, embed, and insert into Milvus.\n\n    Args:\n        s3_endpoint:\
          \ S3-compatible endpoint URL (e.g. MinIO).\n        s3_bucket: S3 bucket\
          \ containing chunk files.\n        milvus_host: Milvus service hostname.\n\
          \        s3_prefix: Key prefix for chunk files in S3.\n        embedding_endpoint:\
          \ Optional embedding service URL. If empty,\n            uses a local sentence-transformers\
          \ model.\n        embedding_model: Embedding model name (for API or local).\n\
          \        embedding_dim: Dimension of the embedding vectors.\n        milvus_port:\
          \ Milvus gRPC port.\n        milvus_db: Milvus database name.\n        milvus_token:\
          \ Milvus authentication token. Empty string for unauthenticated connections.\n\
          \        collection_name: Milvus collection name.\n        drop_existing:\
          \ If True, drop and recreate the collection. If False, append to it.\n \
          \       embed_batch_size: Batch size for embedding requests.\n        milvus_batch_size:\
          \ Batch size for Milvus inserts.\n\n    Returns:\n        The Milvus collection\
          \ name and total vectors inserted.\n    \"\"\"\n    import json\n    import\
          \ os\n    import time\n\n    import boto3\n    import requests as req_lib\n\
          \    from pymilvus import CollectionSchema, DataType, FieldSchema, MilvusClient\n\
          \n    # --- S3 client ---\n    s3 = boto3.client(\n        \"s3\",\n   \
          \     endpoint_url=s3_endpoint,\n        aws_access_key_id=os.environ[\"\
          S3_ACCESS_KEY\"],\n        aws_secret_access_key=os.environ[\"S3_SECRET_KEY\"\
          ],\n        region_name=\"us-east-1\",\n    )\n\n    def stream_chunks_from_s3():\n\
          \        \"\"\"Yield chunks one at a time from S3 JSONL files to avoid loading\
          \ all into memory.\"\"\"\n        paginator = s3.get_paginator(\"list_objects_v2\"\
          )\n        for page in paginator.paginate(Bucket=s3_bucket, Prefix=s3_prefix\
          \ + \"/\"):\n            for obj in page.get(\"Contents\", []):\n      \
          \          key = obj[\"Key\"]\n                if not key.endswith(\".jsonl\"\
          ):\n                    continue\n                resp = s3.get_object(Bucket=s3_bucket,\
          \ Key=key)\n                body = resp[\"Body\"].read().decode(\"utf-8\"\
          )\n                for line in body.strip().split(\"\\n\"):\n          \
          \          if line:\n                        yield json.loads(line)\n\n\
          \    # --- Setup Milvus collection ---\n    uri = f\"http://{milvus_host}:{milvus_port}\"\
          \n    milvus_kwargs = {\"uri\": uri, \"db_name\": milvus_db}\n    if milvus_token:\n\
          \        milvus_kwargs[\"token\"] = milvus_token\n    client = MilvusClient(**milvus_kwargs)\n\
          \n    collection_exists = client.has_collection(collection_name)\n\n   \
          \ if collection_exists and not drop_existing:\n        desc = client.describe_collection(collection_name)\n\
          \        for field in desc.get(\"fields\", []):\n            if field.get(\"\
          name\") == \"embedding\":\n                existing_dim = field.get(\"params\"\
          , {}).get(\"dim\")\n                if existing_dim is not None and int(existing_dim)\
          \ != embedding_dim:\n                    raise ValueError(\n           \
          \             f\"Existing collection '{collection_name}' has dim={existing_dim},\
          \ \"\n                        f\"but embedding_dim={embedding_dim}. Drop\
          \ the collection or fix the dimension.\"\n                    )\n      \
          \          break\n        print(f\"Appending to existing collection '{collection_name}'.\"\
          )\n    else:\n        if collection_exists:\n            print(f\"Dropping\
          \ existing collection '{collection_name}'\")\n            client.drop_collection(collection_name)\n\
          \n        schema = CollectionSchema(\n            fields=[\n           \
          \     FieldSchema(name=\"id\", dtype=DataType.INT64, is_primary=True, auto_id=True),\n\
          \                FieldSchema(name=\"source_file\", dtype=DataType.VARCHAR,\
          \ max_length=512),\n                FieldSchema(name=\"source_document_id\"\
          , dtype=DataType.VARCHAR, max_length=256),\n                FieldSchema(name=\"\
          pipeline_run_id\", dtype=DataType.VARCHAR, max_length=64),\n           \
          \     FieldSchema(name=\"chunk_index\", dtype=DataType.INT64),\n       \
          \         FieldSchema(name=\"text\", dtype=DataType.VARCHAR, max_length=32768),\n\
          \                FieldSchema(name=\"category\", dtype=DataType.VARCHAR,\
          \ max_length=128),\n                FieldSchema(name=\"subcategory\", dtype=DataType.VARCHAR,\
          \ max_length=128),\n                FieldSchema(name=\"document_date\",\
          \ dtype=DataType.VARCHAR, max_length=32),\n                FieldSchema(\n\
          \                    name=\"embedding\",\n                    dtype=DataType.FLOAT_VECTOR,\n\
          \                    dim=embedding_dim,\n                ),\n          \
          \  ],\n            description=\"RAG document chunks with traceability and\
          \ metadata\",\n        )\n        client.create_collection(collection_name=collection_name,\
          \ schema=schema)\n\n        index_params = client.prepare_index_params()\n\
          \        if index_type == \"HNSW\":\n            index_params.add_index(\n\
          \                field_name=\"embedding\",\n                index_type=\"\
          HNSW\",\n                metric_type=\"COSINE\",\n                params={\"\
          M\": 16, \"efConstruction\": 256},\n            )\n        elif index_type\
          \ == \"IVF_FLAT\":\n            index_params.add_index(\n              \
          \  field_name=\"embedding\",\n                index_type=\"IVF_FLAT\",\n\
          \                metric_type=\"COSINE\",\n                params={\"nlist\"\
          : 128},\n            )\n        else:\n            raise ValueError(f\"\
          Unsupported index_type: {index_type}. Use 'HNSW' or 'IVF_FLAT'.\")\n   \
          \     client.create_index(collection_name=collection_name, index_params=index_params)\n\
          \        print(f\"Collection '{collection_name}' created (dim={embedding_dim},\
          \ {index_type} index).\")\n\n    # --- Setup embedding ---\n    use_endpoint\
          \ = bool(embedding_endpoint)\n    local_model = None\n\n    if use_endpoint:\n\
          \        print(f\"Using embedding endpoint: {embedding_endpoint}\")\n  \
          \  else:\n        print(f\"Using local embedding model: {embedding_model}\"\
          )\n        from sentence_transformers import SentenceTransformer\n\n   \
          \     local_model = SentenceTransformer(embedding_model)\n\n    def _embed_and_insert(batch):\n\
          \        texts = [c[\"text\"] for c in batch]\n        if use_endpoint:\n\
          \            all_embeddings = []\n            for j in range(0, len(texts),\
          \ embed_batch_size):\n                embed_batch = texts[j : j + embed_batch_size]\n\
          \                resp = req_lib.post(\n                    f\"{embedding_endpoint}/v1/embeddings\"\
          ,\n                    json={\"model\": embedding_model, \"input\": embed_batch},\n\
          \                    timeout=120,\n                )\n                resp.raise_for_status()\n\
          \                data = resp.json()[\"data\"]\n                data.sort(key=lambda\
          \ x: x[\"index\"])\n                all_embeddings.extend([d[\"embedding\"\
          ] for d in data])\n            embeddings = all_embeddings\n        else:\n\
          \            embeddings = local_model.encode(\n                texts,\n\
          \                normalize_embeddings=True,\n                show_progress_bar=False,\n\
          \                batch_size=embed_batch_size,\n            ).tolist()\n\n\
          \        data = [\n            {\n                \"source_file\": c[\"\
          source_file\"],\n                \"source_document_id\": c.get(\"source_document_id\"\
          , c[\"source_file\"]),\n                \"pipeline_run_id\": pipeline_run_id\
          \ or \"unknown\",\n                \"chunk_index\": c[\"chunk_index\"],\n\
          \                \"text\": c[\"text\"],\n                \"category\": c.get(\"\
          category\", \"\"),\n                \"subcategory\": c.get(\"subcategory\"\
          , \"\"),\n                \"document_date\": c.get(\"document_date\", \"\
          \"),\n                \"embedding\": emb,\n            }\n            for\
          \ c, emb in zip(batch, embeddings)\n        ]\n        client.insert(collection_name=collection_name,\
          \ data=data)\n        return len(data)\n\n    # --- Embed and insert in\
          \ streaming batches ---\n    start_time = time.time()\n    total_inserted\
          \ = 0\n    file_count = 0\n    batch = []\n    seen_files = set()\n\n  \
          \  for chunk in stream_chunks_from_s3():\n        batch.append(chunk)\n\
          \        src = chunk.get(\"source_file\", \"\")\n        if src not in seen_files:\n\
          \            seen_files.add(src)\n            file_count += 1\n\n      \
          \  if len(batch) < milvus_batch_size:\n            continue\n\n        total_inserted\
          \ += _embed_and_insert(batch)\n        batch = []\n\n        if (total_inserted\
          \ // milvus_batch_size) % 10 == 0:\n            elapsed = time.time() -\
          \ start_time\n            print(f\"  Inserted {total_inserted} vectors ({file_count}\
          \ files, {elapsed:.1f}s)\")\n\n    if batch:\n        total_inserted +=\
          \ _embed_and_insert(batch)\n\n    if total_inserted == 0:\n        raise\
          \ FileNotFoundError(f\"No chunks found in s3://{s3_bucket}/{s3_prefix}/\"\
          )\n\n    # Load collection for searching\n    client.load_collection(collection_name)\n\
          \    stats = client.get_collection_stats(collection_name)\n\n    wall_clock\
          \ = time.time() - start_time\n    print(f\"\\nIngestion complete: {total_inserted}\
          \ vectors in {wall_clock:.1f}s\")\n    print(f\"Collection stats: {stats}\"\
          )\n\n    # --- OpenLineage emission (best-effort) ---\n    try:\n      \
          \  from rhoai_lineage.kfp.lineage import kfp_lineage\n        from rhoai_lineage.naming\
          \ import s3_dataset, milvus_dataset\n        from urllib.parse import urlparse\
          \ as _urlparse\n\n        _s3_parsed = _urlparse(s3_endpoint)\n        _s3_host\
          \ = _s3_parsed.hostname or \"minio\"\n        _s3_port = _s3_parsed.port\
          \ or 9000\n\n        input_ns, input_name = s3_dataset(\n            bucket=s3_bucket,\
          \ path=s3_prefix, host=_s3_host, port=_s3_port,\n        )\n        input_ds\
          \ = {\"namespace\": input_ns, \"name\": input_name}\n\n        output_ns,\
          \ output_name = milvus_dataset(\n            collection=collection_name,\
          \ host=milvus_host, port=milvus_port,\n        )\n        output_ds = {\n\
          \            \"namespace\": output_ns,\n            \"name\": output_name,\n\
          \            \"facets\": {\n                \"custom_metrics\": {\n    \
          \                \"_producer\": \"https://github.com/rhoai-lineage\",\n\
          \                    \"_schemaURL\": \"https://openlineage.io/spec/2-0-2/OpenLineage.json#/$defs/CustomFacet\"\
          ,\n                    \"vectors_inserted\": total_inserted,\n         \
          \           \"embedding_model\": embedding_model,\n                    \"\
          embedding_dim\": embedding_dim,\n                    \"collection_name\"\
          : collection_name,\n                    \"index_type\": index_type,\n  \
          \                  \"duration_seconds\": round(wall_clock, 2),\n       \
          \         },\n            },\n        }\n\n        ol_run_facets = {}\n\
          \        if pipeline_run_id:\n            ol_run_facets[\"pipelineRunId\"\
          ] = {\n                \"_producer\": \"rhoai-lineage\",\n             \
          \   \"_schemaURL\": \"https://openlineage.io/spec/1-0-0/OpenLineage.json\"\
          ,\n                \"id\": pipeline_run_id,\n            }\n\n        with\
          \ kfp_lineage(\n            \"ingest_to_milvus\",\n            inputs=[input_ds],\n\
          \            outputs=[output_ds],\n            run_facets=ol_run_facets,\n\
          \        ):\n            pass\n        print(\"OpenLineage COMPLETE event\
          \ emitted for ingest_to_milvus\")\n    except Exception as e:\n        print(f\"\
          WARNING: OpenLineage emission failed (non-fatal): {e}\")\n\n    # --- MLflow\
          \ tracking via REST API (best-effort) ---\n    # Direct REST calls with\
          \ SA token auth \u2014 the RHOAI MLflow Operator\n    # requires Authorization\
          \ + X-Mlflow-Workspace headers that the vanilla\n    # mlflow client doesn't\
          \ inject from KFP pods.\n    try:\n        class _MLflowRESTTracker:\n \
          \           def __init__(self):\n                self._url = \"https://mlflow.redhat-ods-applications.svc:8443\"\
          \n                self._headers = {\"Content-Type\": \"application/json\"\
          }\n                self._run_id = None\n                self._experiment_id\
          \ = None\n                _sa_token = \"/var/run/secrets/kubernetes.io/serviceaccount/token\"\
          \n                _sa_ns = \"/var/run/secrets/kubernetes.io/serviceaccount/namespace\"\
          \n                if os.path.exists(_sa_token):\n                    with\
          \ open(_sa_token) as f:\n                        self._headers[\"Authorization\"\
          ] = f\"Bearer {f.read().strip()}\"\n                if os.path.exists(_sa_ns):\n\
          \                    with open(_sa_ns) as f:\n                        self._headers[\"\
          X-Mlflow-Workspace\"] = f.read().strip()\n\n            def _post(self,\
          \ endpoint, data):\n                resp = req_lib.post(f\"{self._url}{endpoint}\"\
          , json=data,\n                                    headers=self._headers,\
          \ verify=False, timeout=10)\n                resp.raise_for_status()\n \
          \               return resp.json()\n\n            def create_experiment(self,\
          \ name):\n                try:\n                    result = self._post(\"\
          /api/2.0/mlflow/experiments/create\", {\"name\": name})\n              \
          \      self._experiment_id = result.get(\"experiment_id\")\n           \
          \     except Exception:\n                    resp = req_lib.get(f\"{self._url}/api/2.0/mlflow/experiments/get-by-name\"\
          ,\n                                       params={\"experiment_name\": name},\n\
